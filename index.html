    <!-- Fonts are self-hosted and bundled (src/fonts.ts); nothing is fetched
         from Google. The cuts the first screen of every page is set in are
         preloaded: the page is drawn by script, so they arrive with it and the
         text never swaps in. The fallback faces in fonts.css are sized from
         Arial and Georgia, which Android does not have, so there the swap
         moved the page by half a screen. -->
